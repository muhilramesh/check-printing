<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in &middot; CRC Check Printing</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="login-page">
  <form class="login-card" id="loginForm" autocomplete="off">
    <div class="login-brand">
      <div class="login-logo">CRC</div>
      <h1>Check Printing</h1>
      <p class="muted">Sign in to continue</p>
    </div>

    <label for="username">Username</label>
    <input id="username" type="text" autocomplete="username" required />

    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required />

    <div class="login-error" id="loginError" hidden></div>

    <button type="submit" class="btn primary login-submit">Sign in</button>
  </form>

  <script src="login.js"></script>
</body>
</html>
